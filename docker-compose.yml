services:
  # NOTE: the password below is a documented local-development-only value,
  # shared between this file and the app container's DB_PASSWORD. It is
  # intentionally NOT a hardcoded fallback anywhere in the application code
  # (cmd/server/main.go requires DB_PASSWORD to be set explicitly and fails
  # fast otherwise, with a startup warning if this exact value is ever used
  # against a non-local host). Override it here (and in orchestrix's
  # DB_PASSWORD below) before deploying anywhere but a local machine.
  postgres:
    image: postgres:16-alpine
    container_name: orchestrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchestrix
      POSTGRES_PASSWORD: orchestrix_dev_password
      POSTGRES_DB: orchestrix_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrix -d orchestrix_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    container_name: orchestrix-migrate
    command:
      [
        "-path=/migrations",
        "-database=postgres://orchestrix:orchestrix_dev_password@postgres:5432/orchestrix_dev?sslmode=disable",
        "up",
      ]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orchestrix:
    build: .
    container_name: orchestrix-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: orchestrix
      DB_PASSWORD: orchestrix_dev_password
      DB_NAME: orchestrix_dev
      DB_SSLMODE: disable
      CONFIG_PATH: /app/configs/base.yaml
    ports:
      - "8080:8080"

volumes:
  postgres_data:
