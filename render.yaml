services:
  - type: web
    name: orchestrix
    runtime: docker
    plan: free # Free tier: spins down after ~15 min idle; background workers pause while asleep
    region: oregon
    healthCheckPath: /health
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      # External Postgres (e.g. Neon/Supabase). Render prompts for this value
      # in the dashboard during Blueprint sync; it is never stored in git.
      # Use the DIRECT (non-pooled) connection string with sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CONFIG_PATH
        value: /app/configs/base.yaml
      - key: RUN_MIGRATIONS
        value: "true"
